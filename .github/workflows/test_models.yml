name: Test Models Compatibility With Tinygrad Changes
on:
  pull_request:
    paths:
      - 'tinygrad_repo'
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.set-matrix.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and Parse json
        id: set-matrix
        run: |
          python3 -c '
          import json, urllib.request, os, re

          with open("openpilot/sunnypilot/models/fetcher.py", "r") as f:
            urls = re.findall(r"MODEL_URL(?:_CHESTNUT)?\s*=\s*[\"'"'"']([^\"'"'"']+)[\"'"'"']", f.read())

          artifacts = []
          for url in urls:
            data = json.loads(urllib.request.urlopen(url).read())
            bundles = data.get("bundles", [])
            # Exercise the full QCOM and Chestnut catalogs so the Tinygrad pin change cannot regress either slot.
            selected = bundles
            expected_device = "AMD" if "chestnut" in url else "QCOM"
            for bundle in selected:
              for model in bundle.get("models", []):
                if "artifact" in model:
                  artifact = dict(model["artifact"])
                  artifact["expected_device"] = expected_device
                  artifacts.append(artifact)
          print(f"Testing {len(artifacts)} artifacts")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"models={json.dumps(artifacts)}\n")
          '

  test-model:
    name: Test ${{ matrix.artifact.file_name }}
    needs: generate-matrix
    runs-on: ubuntu-latest
    container: ghcr.io/commaai/openpilot-base:latest
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJson(needs.generate-matrix.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Model Artifact
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_URL: ${{ matrix.artifact.download_uri.url }}
          MODEL_FILE: ${{ matrix.artifact.file_name }}
        run: |
          mkdir -p /tmp/model_chunks
          echo '${{ toJson(matrix.artifact.chunks) }}' > chunks.json

          python3 - <<'PY'
          import json, os, subprocess

          with open("chunks.json") as f:
            chunks = json.load(f) or []
          base_url = os.environ["MODEL_URL"]
          model_file = os.environ["MODEL_FILE"]
          dest_dir = "/tmp/model_chunks"
          token = os.environ.get("HF_TOKEN", "")

          if chunks:
            manifest_path = os.path.join(dest_dir, f"{model_file}.chunkmanifest")
            with open(manifest_path, "w") as f:
              f.write(str(len(chunks)))
            base_dir = base_url.rsplit("/", 1)[0]
            config_path = "/tmp/curl_config.txt"
            with open(config_path, "w") as f:
              for chunk in chunks:
                name = chunk["file_name"]
                f.write(f'url = "{base_dir}/{name}"\noutput = "{dest_dir}/{name}"\n')
                if token:
                  f.write(f'header = "Authorization: Bearer {token}"\n')
            subprocess.run(["curl", "-Z", "--parallel-immediate", "--parallel-max", "12",
                            "--retry", "3", "--retry-all-errors", "-s", "-S", "-f", "-L",
                            "-K", config_path], check=True)
          else:
            cmd = ["curl", "-fL", "-s", "-S", base_url, "-o", os.path.join(dest_dir, model_file)]
            if token:
              cmd[1:1] = ["-H", f"Authorization: Bearer {token}"]
            subprocess.run(cmd, check=True)
          PY

      - name: Run Model Compatibility Test
        env:
          MODEL_BASE_NAME: ${{ matrix.artifact.file_name }}
          MODEL_CHUNK_DIR: "/tmp/model_chunks"
          MODEL_EXPECTED_DEVICE: ${{ matrix.artifact.expected_device }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/tinygrad_repo:$GITHUB_WORKSPACE:$PYTHONPATH"
          python3 -m pip uninstall -y tinygrad || uv pip uninstall -y tinygrad --system || true
          python3 -m pytest openpilot/sunnypilot/modeld_v2/tests/test_models.py
