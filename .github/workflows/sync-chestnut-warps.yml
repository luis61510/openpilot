name: Sync official Chestnut Tinygrad warp artifacts

on:
  push:
    branches:
      - dev-sp-1015opview-3priority-egpu-audit
    paths:
      - 'tinygrad_repo'
      - '.github/workflows/sync-chestnut-warps.yml'
  workflow_dispatch:

concurrency:
  group: chestnut-warps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-warps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download official Sunnypilot prebuilt artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT_URL="https://api.github.com/repos/sunnypilot/sunnypilot/actions/artifacts/12863105059/zip"
          if ! curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${ARTIFACT_URL}" \
            -o /tmp/sunnypilot-prebuilt.zip; then
            curl -fsSL -H "Accept: application/vnd.github+json" "${ARTIFACT_URL}" -o /tmp/sunnypilot-prebuilt.zip
          fi
          unzip -p /tmp/sunnypilot-prebuilt.zip prebuilt.tar.gz > /tmp/prebuilt.tar.gz
          mkdir -p /tmp/official-warps
          tar -xzf /tmp/prebuilt.tar.gz -C /tmp/official-warps \
            ./openpilot/sunnypilot/modeld_v2/models/big_driving_warp_1344x760_tinygrad.pkl \
            ./openpilot/sunnypilot/modeld_v2/models/big_driving_warp_1928x1208_tinygrad.pkl \
            ./openpilot/sunnypilot/modeld_v2/models/driving_warp_1344x760_tinygrad.pkl \
            ./openpilot/sunnypilot/modeld_v2/models/driving_warp_1928x1208_tinygrad.pkl

      - name: Verify official warp checksums and install files
        run: |
          set -euo pipefail
          SRC=/tmp/official-warps/openpilot/sunnypilot/modeld_v2/models
          sha256sum -c <<'EOF'
          f1689356ff8e516f87e3d75f6b53e66953a11ee5a97e859b4808c9a16bfe671b  /tmp/official-warps/openpilot/sunnypilot/modeld_v2/models/big_driving_warp_1344x760_tinygrad.pkl
          56cc9690e0e9fb719323d2c6646c1305e8bc6bbdfdc807724a605a0d0a37554b  /tmp/official-warps/openpilot/sunnypilot/modeld_v2/models/big_driving_warp_1928x1208_tinygrad.pkl
          4b22fd6bcb3a3e8a642e6866449dd9c30c12e694ff0741cad9e34e4b00d8c5fa  /tmp/official-warps/openpilot/sunnypilot/modeld_v2/models/driving_warp_1344x760_tinygrad.pkl
          9a17fd6acece4fab23784ef0f3f8bba28a049e9599e5e9e5ee7b36e4b1d24a6f  /tmp/official-warps/openpilot/sunnypilot/modeld_v2/models/driving_warp_1928x1208_tinygrad.pkl
          EOF
          mkdir -p openpilot/sunnypilot/modeld_v2/models
          cp "$SRC"/*.pkl openpilot/sunnypilot/modeld_v2/models/

      - name: Publish verified warp binaries as GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/official-warps/openpilot/sunnypilot/modeld_v2/models
          gh release view egpu-warps-v1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create egpu-warps-v1 --repo "${GITHUB_REPOSITORY}" --title "eGPU Tinygrad warp assets v1" \
              --notes "Official Sunnypilot Chestnut/QCOM Tinygrad warp artifacts. SHA256 values are enforced by the Comma runtime downloader."
          gh release upload egpu-warps-v1 \
            big_driving_warp_1344x760_tinygrad.pkl \
            big_driving_warp_1928x1208_tinygrad.pkl \
            driving_warp_1344x760_tinygrad.pkl \
            driving_warp_1928x1208_tinygrad.pkl \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-check
          gh release download egpu-warps-v1 --repo "${GITHUB_REPOSITORY}" --dir /tmp/release-check
          cd /tmp/release-check
          sha256sum -c <<'EOF'
          f1689356ff8e516f87e3d75f6b53e66953a11ee5a97e859b4808c9a16bfe671b  big_driving_warp_1344x760_tinygrad.pkl
          56cc9690e0e9fb719323d2c6646c1305e8bc6bbdfdc807724a605a0d0a37554b  big_driving_warp_1928x1208_tinygrad.pkl
          4b22fd6bcb3a3e8a642e6866449dd9c30c12e694ff0741cad9e34e4b00d8c5fa  driving_warp_1344x760_tinygrad.pkl
          9a17fd6acece4fab23784ef0f3f8bba28a049e9599e5e9e5ee7b36e4b1d24a6f  driving_warp_1928x1208_tinygrad.pkl
          EOF
