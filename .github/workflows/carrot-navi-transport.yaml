name: carrot-navi-transport

on:
  pull_request:
    paths:
      - "openpilot/selfdrive/carrot/**"
      - ".github/workflows/carrot-navi-transport.yaml"
  workflow_dispatch:

jobs:
  transport-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transport dependency
        run: python -m pip install --upgrade pip aiohttp
      - name: Static syntax check
        run: python -m compileall -q openpilot/selfdrive/carrot
      - name: Run local WebSocket transport tests
        env:
          PYTHONPATH: .
        run: python -m unittest openpilot.selfdrive.carrot.tests.test_carrot_navi_transport -v
