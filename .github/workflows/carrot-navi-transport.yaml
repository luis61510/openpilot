name: carrot-navi-transport

on:
  pull_request:
    paths:
      - "openpilot/selfdrive/carrot/**"
      - "openpilot/cereal/**"
      - "openpilot/system/manager/process_config.py"
      - ".github/workflows/carrot-navi-transport.yaml"
  workflow_dispatch:

jobs:
  transport-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transport and Cereal test dependencies
        run: python -m pip install --upgrade pip aiohttp pycapnp==2.1.0
      - name: Static syntax check
        run: python -m compileall -q openpilot/selfdrive/carrot
      - name: Run transport and Cereal tests
        env:
          PYTHONPATH: .:opendbc_repo
        run: |
          python -m unittest openpilot.selfdrive.carrot.tests.test_carrot_navi_transport -v
          python -m unittest openpilot.selfdrive.carrot.tests.test_carrot_navi_cereal -v
